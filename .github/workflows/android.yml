name: Crear APK H96 NEXUS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: |
          unzip -q H96_NEXUS_Proyecto_para_compilar.zip -d proyecto
          cd proyecto/H96_NEXUS_Proyecto_para_compilar
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: H96-NEXUS-APK
          path: proyecto/H96_NEXUS_Proyecto_para_compilar/app/build/outputs/apk/debug/app-debug.apk
